<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Responda 8 perguntas rápidas e descubra se o nosso modelo de marketing faz sentido para o seu negócio.">
<title>Quiz Aden</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png">
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:300;font-display:swap;src:url(/quiz/fonts/poppins-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url(/quiz/fonts/poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url(/quiz/fonts/poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url(/quiz/fonts/poppins-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url(/quiz/fonts/poppins-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:800;font-display:swap;src:url(/quiz/fonts/poppins-latin-800-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: quiz de tela única sobre a capa verde da Aden. Cartão branco com opções em pílula.
   As três faixas de onda da marca sobem a cada resposta: a maré é a barra de progresso. */
:root{
  --verde:#797c46; --verde-medio:#5c5f33; --verde-profundo:#3e4122;
  --verde-suave:#eef0e3; --verde-claro:#d9dcc4;
  --tinta:#2b2e1a; --apoio:#6a6d55; --creme:#fcf9f1; --branco:#ffffff; --erro:#9c3a28;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--verde-medio);color:var(--creme);
  font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--creme);outline-offset:3px}
.card :focus-visible{outline-color:var(--verde-medio)}

/* ---------- fundo vivo ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(170deg,var(--verde) 0%,var(--verde-medio) 55%,var(--verde-profundo) 120%)}
.stage::before{content:"";position:absolute;inset:-30%;
  background:radial-gradient(40% 40% at 30% 30%,rgba(238,240,227,.20),transparent 70%),
             radial-gradient(35% 35% at 75% 60%,rgba(217,220,196,.14),transparent 70%);
  animation:sweep 18s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translate3d(9%,6%,0) rotate(9deg)}}
.orb{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);
  margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);
  transform:translate3d(calc(var(--px,0)*var(--k)*22px),calc(var(--py,0)*var(--k)*22px),0);
  transition:transform .7s var(--ease)}
.orb i{display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.17),rgba(255,255,255,.05) 62%,rgba(255,255,255,0));
  animation:drift var(--d) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(26px,-38px,0) scale(1.09)}}
.tide{position:absolute;left:0;right:0;bottom:0;height:calc(11vh + var(--t,0)*26vh);transition:height 1.2s var(--ease)}
.wave{position:absolute;left:0;bottom:0;width:200%;display:block}
.wave path{fill:currentColor}
.w1{height:100%;color:rgba(217,220,196,.2);animation:flow 26s linear infinite}
.w2{height:82%;color:var(--verde-medio);animation:flow 19s linear infinite reverse}
.w3{height:58%;color:var(--verde-profundo);animation:flow 14s linear infinite}
@keyframes flow{to{transform:translateX(-50%)}}
.floaters{position:absolute;inset:0;display:none}
.fl{position:absolute;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;
  background:rgba(62,65,34,.5);border:1px solid rgba(217,220,196,.35);color:var(--creme);font-size:14px;font-weight:500;
  animation:bob var(--d) ease-in-out infinite alternate}
.fl span{width:24px;height:24px;border-radius:50%;background:var(--verde);display:grid;place-items:center}
.fl svg{width:14px;height:14px;stroke:var(--creme);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-18px)}}
@media (min-width:1100px){.floaters{display:block}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

/* ---------- casca ---------- */
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-block:20px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.logo{width:104px;display:block;animation:fall .9s var(--ease) both}
.logo svg{width:100%;height:auto;display:block}
@keyframes fall{from{opacity:0;transform:translateY(-14px)}}
.top-r{display:flex;align-items:center;gap:10px}
.count{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:rgba(62,65,34,.55);padding:7px 14px;border-radius:999px;color:var(--creme)}
.back{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(252,249,241,.6);background:rgba(62,65,34,.35);color:var(--creme);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background .3s}
.back:hover{transform:translateX(-3px);background:rgba(62,65,34,.6)}
.back svg,.btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#view{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:24px}
.screen.in>*{animation:rise .75s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
.screen.out{animation:leave .26s ease-in forwards}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.985)}}
@keyframes leave{to{opacity:0;transform:translateX(-26px)}}

/* ---------- abertura ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;width:fit-content;margin:0 0 22px;padding:8px 16px;border-radius:999px;
  background:rgba(62,65,34,.55);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--creme)}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--verde-claro);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
h1{margin:0 0 22px;font-size:clamp(34px,8.4vw,68px);line-height:1.04;font-weight:300;letter-spacing:-.025em;text-wrap:balance;outline:none}
h1 b{font-weight:800}
.word{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.word>span{display:inline-block;transform:translateY(112%);animation:up .95s var(--ease) forwards;animation-delay:calc(.15s + var(--i)*85ms)}
@keyframes up{to{transform:none}}
.lead{margin:0 0 20px;max-width:34em;font-size:clamp(17px,2.4vw,20px);font-weight:400}
.note-pill{display:inline-block;width:fit-content;margin:0 0 30px;padding:9px 18px;border-radius:999px;background:rgba(62,65,34,.55);font-size:14px;font-weight:500}

/* ---------- botões ---------- */
.btn{position:relative;display:inline-flex;align-items:center;gap:16px;border:0;border-radius:999px;padding:8px 8px 8px 28px;
  font-size:17px;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s,background .3s,opacity .3s}
.btn .ar{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;transition:transform .4s var(--ease)}
.btn:hover{transform:translateY(-3px)}
.btn:hover .ar{transform:translateX(4px)}
.btn-main{background:var(--creme);color:var(--verde-profundo)}
.btn-main .ar{background:var(--verde-profundo);color:var(--creme)}
.btn-main:hover{box-shadow:0 16px 36px rgba(30,32,16,.38)}
.btn-main.pulse::after{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--creme);animation:ring 2.3s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.75}to{transform:scale(1.28,1.55);opacity:0}}
.btn-card{background:var(--verde-profundo);color:var(--creme)}
.btn-card .ar{background:var(--creme);color:var(--verde-profundo)}
.btn-card:hover{background:var(--verde-medio);box-shadow:0 14px 30px rgba(62,65,34,.3)}
.btn-ghost{background:transparent;color:var(--creme);box-shadow:inset 0 0 0 2px rgba(252,249,241,.7);padding:15px 28px}
.btn-ghost:hover{background:rgba(252,249,241,.12)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- cartão de pergunta ---------- */
.card{position:relative;overflow:hidden;background:var(--branco);color:var(--tinta);border-radius:34px;
  padding:clamp(22px,4vw,40px);box-shadow:0 30px 70px rgba(30,32,16,.38)}
.card::before{content:"";position:absolute;top:-64px;right:-54px;width:220px;height:220px;border-radius:50%;background:var(--verde-suave);z-index:0}
.card>*{position:relative;z-index:1}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.badge{width:54px;height:54px;flex:none;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#fff;animation:pop .7s var(--ease) both .15s}
@keyframes pop{from{transform:scale(.4) rotate(-30deg);opacity:0}}
.badge svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qmeta{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--verde-profundo);line-height:1.35}
.qmeta small{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--apoio);text-transform:none}
.dots{margin-left:auto;display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--verde-claro);transition:background .4s,transform .4s var(--ease)}
.dots i.on{background:var(--verde);transform:scale(1.15)}
.card h2{margin:0 0 8px;font-size:clamp(23px,4.8vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance;outline:none}
.card .sub{margin:0 0 22px;color:var(--apoio);font-size:15.5px;max-width:36em}
.card .sub strong{color:var(--tinta);font-weight:700;background:linear-gradient(transparent 58%,var(--verde-claro) 58%);padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.aviso{display:flex;align-items:center;gap:12px;width:fit-content;max-width:100%;margin:0 0 22px;padding:10px 18px 10px 10px;border-radius:20px;background:var(--verde-suave);color:var(--tinta);font-size:14.5px;font-weight:500;line-height:1.4}
.aviso span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;font-style:italic}
.aviso+.opts{margin-top:0}
.opts{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}
.sub+.opts{margin-top:0}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border:1.5px solid transparent;background:var(--verde-suave);color:var(--tinta);border-radius:26px;padding:14px 18px;
  font-size:16px;font-weight:500;line-height:1.35;cursor:pointer;
  animation:optIn .6s var(--ease) backwards;animation-delay:calc(.3s + var(--n)*65ms);
  transition:transform .25s var(--ease),border-color .25s,background .3s,color .3s,box-shadow .3s,opacity .3s}
@keyframes optIn{from{opacity:0;transform:translateX(-22px)}}
.opt:hover{transform:translateY(-2px);border-color:var(--verde);box-shadow:0 10px 24px rgba(92,95,51,.16)}
.opt .ck{flex:none;width:28px;height:28px;border-radius:50%;background:var(--branco);border:2px solid var(--verde-claro);display:grid;place-items:center;transition:background .3s,border-color .3s}
.opt:hover .ck{border-color:var(--verde)}
.ck svg{width:16px;height:16px;stroke:var(--creme);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .08s var(--ease)}
.opt[aria-checked="true"]{background:var(--verde-medio);color:var(--creme);border-color:var(--verde-medio)}
.opt[aria-checked="true"] .ck{background:var(--verde);border-color:var(--creme)}
.opt[aria-checked="true"] .ck svg{stroke-dashoffset:0}
.opt .rip{position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:12px;height:12px;margin:-6px;border-radius:50%;background:rgba(121,124,70,.4);transform:scale(0);pointer-events:none}
.opt.go .rip{animation:rip .75s ease-out}
@keyframes rip{from{transform:scale(0);opacity:1}to{transform:scale(70);opacity:0}}
.opts.done .opt[aria-checked="false"]{opacity:.35;transform:scale(.985)}
.opts .sep{display:flex;align-items:center;gap:12px;color:var(--apoio);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;animation:optIn .6s var(--ease) backwards;animation-delay:.9s}
.opts .sep::before,.opts .sep::after{content:"";flex:1;height:1px;background:var(--verde-claro)}
.other{display:grid;gap:12px;margin-top:12px;justify-items:start}
.other .f{width:100%}
.other:not([hidden]){animation:rise .5s var(--ease) both}

/* ---------- campos ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 22px}
.fgrid .full{grid-column:1/-1}
.f{position:relative}
.f input{width:100%;padding:25px 18px 8px;border:1.5px solid var(--verde-claro);border-radius:18px;background:var(--branco);
  color:var(--tinta);font-size:16px;font-weight:500;outline:none;transition:border-color .25s,box-shadow .25s}
.f input:focus{border-color:var(--verde);box-shadow:0 0 0 4px rgba(121,124,70,.22)}
.f label{position:absolute;left:19px;top:16px;font-size:16px;color:var(--apoio);pointer-events:none;transition:top .22s var(--ease),font-size .22s var(--ease),color .22s}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:7px;font-size:12px;font-weight:600;color:var(--verde-medio)}
.f input[aria-invalid="true"]{border-color:var(--erro)}
.err{display:block;min-height:0;margin:4px 6px 0;font-size:13px;font-weight:500;color:var(--erro)}
.err:empty{display:none}

/* ---------- carregando e resultados ---------- */
.center{align-items:center;text-align:center}
.mark{width:96px;height:96px;margin:0 auto 26px;animation:breathe 1.6s ease-in-out infinite}
.mark svg{width:100%;height:100%;display:block;border-radius:24px}
@keyframes breathe{50%{transform:scale(1.12) rotate(-4deg)}}
.big{margin:0 0 14px;font-size:clamp(24px,5vw,34px);font-weight:300}
.big b{font-weight:800}
.dots3{display:flex;gap:8px;justify-content:center}
.dots3 i{width:10px;height:10px;border-radius:50%;background:var(--creme);animation:jump 1s ease-in-out infinite}
.dots3 i:nth-child(2){animation-delay:.15s}.dots3 i:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
.seal{width:108px;height:108px;margin:0 0 22px;display:block}
.s-bg{fill:rgba(62,65,34,.5)}
.s-ring,.s-ck{fill:none;stroke:var(--creme);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.s-ring{stroke-width:5;transform:rotate(-90deg);transform-origin:60px 60px;animation:draw 1.1s .2s var(--ease) forwards}
.s-ck{stroke-width:7;animation:draw .6s 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.res .lt{font-weight:300}
.res .lead b{font-weight:700}
.recap{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.recap li{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:rgba(62,65,34,.55);font-size:14px;font-weight:500;
  animation:optIn .6s var(--ease) backwards;animation-delay:calc(1.1s + var(--n)*90ms)}
.recap li span{width:22px;height:22px;border-radius:50%;background:var(--verde);display:grid;place-items:center}
.recap li svg{width:12px;height:12px;stroke:var(--creme);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:26px}
.foot{display:inline-block;width:fit-content;padding:9px 18px;border-radius:999px;background:rgba(62,65,34,.55);font-size:13.5px;font-weight:500;line-height:1.5;user-select:text}

/* ---------- visão da equipe (só com #equipe no endereço) ---------- */
#eq{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 24px));
  max-height:60vh;overflow:auto;padding:14px 16px;border-radius:20px;background:rgba(43,46,26,.88);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--creme);font-size:13px;line-height:1.5}
#eq strong{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--verde-claro);margin-bottom:6px}
#eq .tag{display:inline-block;margin:2px 0 8px;padding:4px 12px;border-radius:999px;background:var(--verde);font-weight:700}
#eq ul{margin:0 0 10px;padding-left:18px}
#eq button{border:1.5px solid var(--verde-claro);background:transparent;color:var(--creme);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}

@media (max-width:560px){
  .app{padding-block:14px 24px}
  .logo{width:88px}
  .card{border-radius:28px}
  .btn{font-size:16px}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
[hidden]{display:none!important}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.falha{margin:0 auto 18px;max-width:34rem;padding:12px 16px;border-radius:var(--r-item,14px);background:rgba(255,255,255,.14);font-size:.9rem;line-height:1.45;text-align:center}
</style>
</head>
<body>

<div class="stage" id="stage" aria-hidden="true">
  <div class="orb" style="--x:12%;--y:18%;--s:220px;--k:.5;--d:9s"><i></i></div>
  <div class="orb" style="--x:88%;--y:30%;--s:340px;--k:1;--d:13s"><i></i></div>
  <div class="orb" style="--x:70%;--y:76%;--s:190px;--k:1.5;--d:11s"><i></i></div>
  <div class="orb" style="--x:18%;--y:72%;--s:300px;--k:.8;--d:15s"><i></i></div>
  <div class="orb" style="--x:52%;--y:8%;--s:150px;--k:1.2;--d:8s"><i></i></div>
  <div class="orb" style="--x:94%;--y:90%;--s:250px;--k:.6;--d:12s"><i></i></div>
  <div class="floaters">
    <div class="fl" style="left:5%;top:28%;--d:5s"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Verba</div>
    <div class="fl" style="left:8%;top:52%;--d:6.5s"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Margem</div>
    <div class="fl" style="right:5%;top:34%;--d:5.8s"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Atendimento</div>
    <div class="fl" style="right:8%;top:58%;--d:7s"><span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>CRM</div>
  </div>
  <div class="tide" id="tide">
    <svg class="wave w1" viewBox="0 0 2880 220" preserveAspectRatio="none"><path d="M0 90 Q360 10 720 90 T1440 90 T2160 90 T2880 90 V220 H0Z"/></svg>
    <svg class="wave w2" viewBox="0 0 2880 220" preserveAspectRatio="none"><path d="M0 100 Q360 30 720 100 T1440 100 T2160 100 T2880 100 V220 H0Z"/></svg>
    <svg class="wave w3" viewBox="0 0 2880 220" preserveAspectRatio="none"><path d="M0 110 Q360 50 720 110 T1440 110 T2160 110 T2880 110 V220 H0Z"/></svg>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

/* ---------- regras de qualificação (uso interno) ---------- */
function evaluate(){
  var a=ans,m=[];
  if(!a.fat)return {status:'Sem respostas',motivos:[]};
  var lw=a.fat.i<2;
  if(social)return {status:'Só social media',motivos:[]};
  if(lw&&a.gate&&a.gate.i===1)return {status:'Desqualificado',motivos:['Fatura abaixo de R$ 30 mil e não consegue investir R$ 1.500']};
  if(a.mar&&a.mar.i===0)m.push('Margem abaixo de R$ 30 a cada R$ 100');
  if(a.tic&&a.tic.i===2)m.push('Ciclo longo de venda');
  if(a.ate&&a.ate.i>=2)m.push('Atendimento sem processo');
  if(a.reg&&a.reg.i===3)m.push('Não registra vendas');
  if(!lw&&a.vrb&&a.vrb.i===0)m.push('Fatura acima de R$ 30 mil, mas verba abaixo de R$ 1.500');
  return {status:m.length?'Qualificado com ressalva':'Qualificado',motivos:m};
}

  var hw=words.map(function(w,i){return '<span class="word" aria-hidden="true"><span style="--i:'+i+'">'+w+'</span></span>'}).join(' ')+
    ' <span class="word" aria-hidden="true"><span style="--i:7"><b>marketing?</b></span></span>';
  return h('<div class="hero">'+
    '<p class="eyebrow" style="--n:0">Quiz da Aden</p>'+
    '<h1 tabindex="-1" aria-label="Sua empresa está pronta para crescer com marketing?">'+hw+'</h1>'+
    '<p class="lead" style="--n:7">Responda 8 perguntas rápidas. No final, a gente te mostra se faz sentido trabalhar juntos.</p>'+
    '<p class="note-pill" style="--n:8">Leva 2 minutos. Atendemos poucos clientes por vez.</p>'+
    '<div style="--n:9"><button class="btn btn-main pulse" id="go" type="button">Começar<span class="ar">'+AR+'</span></button></div>'+
  '</div>');
}
function questionScreen(k){
  var q=Q[k],st=stepOf(k),sel=ans[k],i,dots='';
  for(i=1;i<=8;i++)dots+='<i class="'+(i<=st?'on':'')+'"></i>';
  var lis=q.o.map(function(o,i){
    return (q.sep===i?'<li class="sep" aria-hidden="true">ou</li>':'')+
      '<li><button type="button" class="opt" role="radio" aria-checked="'+(!!sel&&sel.i===i)+'" data-i="'+i+'" style="--n:'+i+'">'+
      '<span class="ck">'+CK+'</span><span class="tx">'+esc(o)+'</span><span class="rip"></span></button></li>';
  }).join('');
  var other=q.other?('<div class="other" id="other" '+((sel&&sel.i===q.other)?'':'hidden')+'>'+
    '<div class="f"><input id="oth" maxlength="60" placeholder=" " autocomplete="off" value="'+((sel&&sel.i===q.other)?esc(sel.label):'')+'"><label for="oth">Qual é o segmento?</label></div>'+
    '<button type="button" class="btn btn-card" id="othgo" disabled>Continuar<span class="ar">'+AR+'</span></button></div>'):'';
  return h('<div><section class="card" aria-labelledby="qt">'+
    '<div class="qhead"><span class="badge">'+icon(q.ic)+'</span>'+
    '<div class="qmeta">Pergunta '+st+' de 8<small>'+esc(q.label)+'</small></div>'+
    '<div class="dots" aria-hidden="true">'+dots+'</div></div>'+
    '<h2 id="qt" tabindex="-1">'+esc(q.t)+'</h2>'+
    (q.s?'<p class="sub">'+fmt(q.s)+'</p>':'')+(q.aviso?'<p class="aviso"><span aria-hidden="true">i</span>'+esc(q.aviso)+'</p>':'')+
    '<ul class="opts" role="radiogroup" aria-labelledby="qt">'+lis+'</ul>'+other+
  '</section></div>');
}
function bindQuestion(el,k){
  var q=Q[k],root=$('.card',el);
  root.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(e){choose(k,+b.dataset.i,b,e,root)});
  });
  if(q.other){
    var inp=$('#oth',el),go=$('#othgo',el);
    var sync=function(){go.disabled=inp.value.trim().length<2};
    sync();
    inp.addEventListener('input',sync);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!go.disabled){e.preventDefault();go.click()}});
    go.addEventListener('click',function(){
      if(locked||go.disabled)return;
      locked=true;save(k,q.other,inp.value.trim());
      $('.opts',root).classList.add('done');
      setTimeout(function(){advance(k)},RM?40:380);
    });
  }
}
function choose(k,i,btn,e,root){
  if(locked)return;
  var q=Q[k],r=btn.getBoundingClientRect();
  var cx=(e&&e.detail)?e.clientX-r.left:r.width/2,cy=(e&&e.detail)?e.clientY-r.top:r.height/2;
  btn.style.setProperty('--rx',cx+'px');btn.style.setProperty('--ry',cy+'px');
  root.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-checked',String(b===btn))});
  btn.classList.remove('go');void btn.offsetWidth;btn.classList.add('go');
  if(q.other===i){
    var ot=$('#other',root);ot.hidden=false;
    var inp=$('#oth',root);setTimeout(function(){inp.focus({preventScroll:false})},60);
    return;
  }
  var ot2=$('#other',root);if(ot2)ot2.hidden=true;
  locked=true;save(k,i,q.o[i]);
  $('.opts',root).classList.add('done');
  setTimeout(function(){advance(k)},RM?60:600);
}
function advance(k){go(nextOf(k))}

function formScreen(){
  var f=function(id,lb,ac,type,full,mode){
    return '<div class="f'+(full?' full':'')+'"><input id="'+id+'" name="'+id+'" type="'+(type||'text')+'" placeholder=" " autocomplete="'+ac+'"'+(mode?' inputmode="'+mode+'"':'')+(lead&&lead[id]?' value="'+esc(lead[id])+'"':'')+'>'+
      '<label for="'+id+'">'+lb+'</label><span class="err" id="e-'+id+'" aria-live="polite"></span></div>';
  };
  return h('<div><form class="card" id="lf" novalidate aria-labelledby="qt">'+
    '<div class="qhead"><span class="badge">'+icon('usr')+'</span><div class="qmeta">Última etapa<small>Seus dados</small></div></div>'+
    '<h2 id="qt" tabindex="-1">Quase lá. Para onde enviamos a sua análise?</h2>'+
    '<p class="sub">Seus dados ficam só com a nossa equipe. A gente chama no WhatsApp em até 1 dia útil.</p>'+
    '<div class="fgrid">'+f('nome','Nome','name','text',true)+f('whatsapp','WhatsApp com DDD','tel-national','tel',false,'tel')+f('empresa','Nome da empresa','organization','text',false)+
    f('instagram','Instagram ou site','off','text',false)+f('cidade','Cidade','address-level2','text',false)+'</div>'+
    '<div class="hp" aria-hidden="true"><label for="site">Não preencha este campo</label><input id="site" name="site" type="text" tabindex="-1" autocomplete="off"></div>'+
    '<button class="btn btn-card" type="submit">Ver minha análise<span class="ar">'+AR+'</span></button>'+
  '</form></div>');
}
function bindForm(el){
  var form=$('#lf',el),wp=$('#whatsapp',el);
  wp.addEventListener('input',function(){
    var d=wp.value.replace(/\D/g,'').slice(0,11),o='';
    if(d.length>0)o='('+d.slice(0,2);
    if(d.length>2)o+=') '+d.slice(2,d.length>10?7:6);
    if(d.length>(d.length>10?7:6))o+='-'+d.slice(d.length>10?7:6);
    wp.value=o;
  });
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var v={};['nome','whatsapp','empresa','instagram','cidade'].forEach(function(id){v[id]=$('#'+id,form).value.trim()});
    var errs={};
    if(v.nome.length<2)errs.nome='Escreva seu nome.';
    if(v.whatsapp.replace(/\D/g,'').length<10)errs.whatsapp='Escreva o WhatsApp com DDD.';
    if(v.empresa.length<2)errs.empresa='Escreva o nome da empresa.';
    ['nome','whatsapp','empresa'].forEach(function(id){
      var inp=$('#'+id,form);$('#e-'+id,form).textContent=errs[id]||'';
      inp.setAttribute('aria-invalid',errs[id]?'true':'false');
    });
    var first=Object.keys(errs)[0];
    if(first){$('#'+first,form).focus();return}
    v.site=$('#site',form).value;lead=v;go('load');
  });
}

function recap(){
  var a=ans,items=[];
  if(a.seg)items.push(a.seg.label);
  if(a.fat)items.push('Fatura '+a.fat.label.charAt(0).toLowerCase()+a.fat.label.slice(1));
  if(a.vrb)items.push('Verba '+a.vrb.label.charAt(0).toLowerCase()+a.vrb.label.slice(1));
  if(a.obj)items.push(a.obj.label);
  return '<ul class="recap" aria-label="Suas respostas">'+items.map(function(t,i){
    return '<li style="--n:'+i+'"><span>'+CK+'</span>'+esc(t)+'</li>';
  }).join('')+'</ul>';
}

/* ---------- navegação ---------- */
function go(k,isBack){
  if(timer){clearTimeout(timer);timer=null}
  if(!isBack&&cur&&['load','res','wait'].indexOf(k)<0)hist.push(cur);
  cur=k;locked=false;track(k);
  var isQ=!!Q[k];
  backBtn.hidden=!(isQ||k==='form')||hist.length===0;
  if(isQ){countEl.hidden=false;countEl.textContent=stepOf(k)+' de 8'}else{countEl.hidden=true}
  if(k==='hero'){setTide(0);swap(heroScreen,function(el){$('#go',el).addEventListener('click',function(){go('seg')})})}
  else if(isQ){setTide(Math.min(.82,(stepOf(k)-1)/8+.06));swap(function(){return questionScreen(k)},function(el){bindQuestion(el,k);focusTitle(el)})}
  else if(k==='form'){setTide(.9);swap(formScreen,function(el){bindForm(el);focusTitle(el)})}
  else if(k==='load'){setTide(1);swap(loadScreen);
    var ini=Date.now(),fim=function(){timer=setTimeout(function(){go('res')},Math.max(0,(RM?200:1800)-(Date.now()-ini)))};
    (salvando=enviar()).then(fim,fim)}
  else if(k==='res'){setTide(.22);swap(resultScreen,function(el){
    var w=$('#wait',el);if(w)w.addEventListener('click',function(){go('wait')});focusTitle(el);burst()})}
  else if(k==='wait'){setTide(.2);swap(waitScreen,focusTitle)}
  else if(k==='desq'){setTide(.1);swap(desqScreen,function(el){
    $('#soc',el).addEventListener('click',function(){social=true;go('form')});focusTitle(el)})}
  panel();
}
backBtn.addEventListener('click',function(){var p=hist.pop();if(p)go(p,true)});

/* ---------- confete de círculos ---------- */
function burst(){
  if(RM)return;
  var c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
  var w=c.width=innerWidth*dpr,hh=c.height=innerHeight*dpr;
  var cols=['#fcf9f1','#d9dcc4','#eef0e3','#ffffff','#797c46'],P=[],i;
  for(i=0;i<90;i++){var a=Math.random()*Math.PI*2,s=(4+Math.random()*9)*dpr;
    P.push({x:w/2,y:hh*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5*dpr,r:(3+Math.random()*8)*dpr,c:cols[i%cols.length],l:1})}
  var f=0;
  (function tick(){
    x.clearRect(0,0,w,hh);f++;
    P.forEach(function(p){p.vx*=.985;p.vy=p.vy*.985+.22*dpr;p.x+=p.vx;p.y+=p.vy;p.l-=.011;
      if(p.l>0){x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.2832);x.fill()}});
    if(f<110)requestAnimationFrame(tick);else x.clearRect(0,0,w,hh);
  })();
}

/* ---------- movimento do fundo com o ponteiro ---------- */
if(!RM){

    stage.style.setProperty('--px',((e.clientX/innerWidth)-.5)*2);
    stage.style.setProperty('--py',((e.clientY/innerHeight)-.5)*2);
  },{passive:true});
}

/* ---------- visão da equipe: abrir o endereço com #equipe ---------- */
function panel(){
  var p=$('#eq');
  if(!EQUIPE||location.hash!=='#equipe'){p.hidden=true;return}
  p.hidden=false;
  var ev=evaluate(),b=$('#eqb'),rows=Object.keys(ans).map(function(k){return '<li>'+esc(Q[k].label)+': '+esc(ans[k].label)+'</li>'}).join('');
  b.innerHTML='<span class="tag">'+esc(ev.status)+'</span>'+
    (ev.motivos.length?'<ul>'+ev.motivos.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul>':'')+
    '<ul>'+rows+'</ul>'+(lead?'<p>'+esc(lead.nome)+', '+esc(lead.whatsapp)+', '+esc(lead.empresa)+'</p>':'');
}

go('hero');
